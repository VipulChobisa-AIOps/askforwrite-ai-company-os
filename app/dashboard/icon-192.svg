<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="afw-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="afw-border-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3" />
    </linearGradient>
    <filter id="afw-glow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#07090e" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="url(#afw-border-192)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="96" cy="96" r="48" fill="#6366f1" opacity="0.25" filter="url(#afw-glow-192)" />

  <!-- Geometric Triangle / Core AI Node -->
  <path d="M96 38 L148 132 H44 Z" fill="url(#afw-grad-192)" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Inner Delta Reflection -->
  <path d="M96 66 L124 120 H68 Z" fill="#07090e" opacity="0.85" />
  <circle cx="96" cy="98" r="10" fill="#22d3ee" />

  <!-- AFW Wordmark -->
  <text x="96" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">AFW OS</text>
</svg>
