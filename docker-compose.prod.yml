services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askforwrite_os}
      POSTGRES_USER: ${POSTGRES_USER:-askforwrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askforwrite} -d ${POSTGRES_DB:-askforwrite_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=500
        -c log_statement=ddl
        -c max_connections=100

  os_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-askforwrite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-askforwrite_os}
      MANAGER_API_KEY: ${MANAGER_API_KEY:?MANAGER_API_KEY is required}
      OWNER_API_KEY: ${OWNER_API_KEY:?OWNER_API_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      FIELD_FORCE_BASE_URL: ${FIELD_FORCE_BASE_URL:-}
      FIELD_FORCE_SERVICE_TOKEN: ${FIELD_FORCE_SERVICE_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # ── AFW DirectPay Sovereign Payment Rails (0% Commission) ──
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-afw_directpay}
      AFW_MERCHANT_UPI_VPA: ${AFW_MERCHANT_UPI_VPA:-ask4write@icici}
      AFW_MERCHANT_NAME: ${AFW_MERCHANT_NAME:-AskforWrite AI Solutions}
      AFW_MERCHANT_EVM_WALLET: ${AFW_MERCHANT_EVM_WALLET:-}
      AFW_MERCHANT_SOL_WALLET: ${AFW_MERCHANT_SOL_WALLET:-}
      WEB3_RPC_URL: ${WEB3_RPC_URL:-https://polygon-rpc.com}
      AFW_BANK_BENEFICIARY: ${AFW_BANK_BENEFICIARY:-}
      AFW_BANK_NAME: ${AFW_BANK_NAME:-ICICI Bank Ltd}
      AFW_BANK_ACCOUNT_NUMBER: ${AFW_BANK_ACCOUNT_NUMBER:-}
      AFW_BANK_ACCOUNT_TYPE: ${AFW_BANK_ACCOUNT_TYPE:-Current Account}
      AFW_BANK_IFSC: ${AFW_BANK_IFSC:-}
      AFW_BANK_SWIFT: ${AFW_BANK_SWIFT:-}
      AFW_BANK_BRANCH: ${AFW_BANK_BRANCH:-}
      # ── Legacy Payment Gateways (Razorpay & PayPal Fallbacks) ──
      ASK4_WEBHOOK_SECRET: ${ASK4_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PAYMENT_LINK: ${RAZORPAY_PAYMENT_LINK:-https://razorpay.me/@askforwrite}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_WEBHOOK_SECRET: ${PAYPAL_WEBHOOK_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PAYMENT_LINK: ${PAYPAL_PAYMENT_LINK:-https://paypal.me/ask4write}
      # ── SMTP Outreach ──
      OUTREACH_DISPATCH_PROVIDER: ${OUTREACH_DISPATCH_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OUTREACH_FROM_EMAIL: ${OUTREACH_FROM_EMAIL:-info@askforwrite.in}
      # ── 4-Site WordPress Publishing Bridge ──
      WP_SITE_URL: ${WP_SITE_URL:-https://askforwrite.in}
      WP_USERNAME: ${WP_USERNAME:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
      # ── AI Brain & Telemetry ──
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-askforwrite-company-os}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
    driver: local
