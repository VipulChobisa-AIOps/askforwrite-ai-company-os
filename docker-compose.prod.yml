services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askforwrite_os}
      POSTGRES_USER: ${POSTGRES_USER:-askforwrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askforwrite} -d ${POSTGRES_DB:-askforwrite_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=500
        -c log_statement=ddl
        -c max_connections=100

  os_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-askforwrite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-askforwrite_os}
      MANAGER_API_KEY: ${MANAGER_API_KEY:?MANAGER_API_KEY is required}
      OWNER_API_KEY: ${OWNER_API_KEY:?OWNER_API_KEY is required}
      FIELD_FORCE_BASE_URL: ${FIELD_FORCE_BASE_URL:-}
      FIELD_FORCE_SERVICE_TOKEN: ${FIELD_FORCE_SERVICE_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # ── Webhook & Payment Gateways ──
      ASK4_WEBHOOK_SECRET: ${ASK4_WEBHOOK_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PAYMENT_LINK: ${RAZORPAY_PAYMENT_LINK:-https://razorpay.me/@askforwrite}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_WEBHOOK_SECRET: ${PAYPAL_WEBHOOK_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PAYMENT_LINK: ${PAYPAL_PAYMENT_LINK:-https://paypal.me/ask4write}
      # ── SMTP Outreach ──
      OUTREACH_DISPATCH_PROVIDER: ${OUTREACH_DISPATCH_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OUTREACH_FROM_EMAIL: ${OUTREACH_FROM_EMAIL:-info@askforwrite.in}
      # ── AI & Telemetry ──
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-askforwrite-company-os}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
    driver: local
