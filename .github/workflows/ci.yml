name: AskforWrite Company OS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # needed for coverage comment on PRs

jobs:
  # ── Job 1: Lint & Syntax Check ────────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check app tests --select=E,F,W --ignore=E501,E402,E741,W291,W293,W292,F841

      - name: Compile-check all Python files
        run: python -m compileall app tests scripts -q

  # ── Job 2: Unit & Integration Tests with Coverage ─────────────────────────
  test:
    name: Run Tests + Coverage Report
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      APP_ENV: development
      MANAGER_API_KEY: test-manager-api-key-32-chars-long-xxx
      OWNER_API_KEY: test-owner-api-key-32-chars-long-xxx
      JWT_SECRET_KEY: test-ci-jwt-secret-key-32-chars-long
      DATABASE_URL: sqlite:///./test_ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx anyio sentry-sdk[fastapi] pytest-cov

      - name: Install Playwright Chromium for E2E suite
        run: |
          python -m playwright install --with-deps chromium

      - name: Run pytest with coverage
        run: |
          python -m pytest -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage to GitHub Actions summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python -m pytest --co -q 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── Job 2b: PostgreSQL 16 Release Verification & Migration Drill (Issue #18) ──
  postgres-verification:
    name: PostgreSQL 16 Migration & Integration Gate
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afw
          POSTGRES_PASSWORD: afw_ci_password
          POSTGRES_DB: afw_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afw -d afw_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://afw:afw_ci_password@127.0.0.1:5432/afw_ci_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg://afw:afw_ci_password@127.0.0.1:5432/afw_ci_test
      MANAGER_API_KEY: test-pg-manager-api-key-32-chars-xxx
      OWNER_API_KEY: test-pg-owner-api-key-32-chars-xxxxx
      JWT_SECRET_KEY: test-pg-jwt-secret-key-32-chars-xxxx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic upgrade, head assertion, downgrade & re-upgrade on empty PostgreSQL 16
        run: |
          alembic upgrade head
          HEAD=$(alembic current | awk '{print $1}' | tail -n 1)
          echo "PostgreSQL current revision: $HEAD"
          if [ "$HEAD" != "p6e1f2a3b4c5" ]; then
            echo "::error::Expected Alembic head p6e1f2a3b4c5, got $HEAD"
            exit 1
          fi
          alembic downgrade -1
          alembic upgrade head

      - name: Run PostgreSQL integration & concurrency tests
        run: |
          python -m pytest tests/test_issue18_postgres_release_verification.py -v --tb=short

  # ── Job 3: Security Scan ──────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit + Release-Blocking pip-audit Gate)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production runtime dependencies & security scanners
        run: |
          python -m pip install --upgrade pip setuptools
          pip install .
          pip install bandit pip-audit

      - name: Bandit SAST scan (high + medium severity - release blocking)
        run: |
          bandit -r app/ -ll -ii --exclude app/dashboard \
            --skip B101,B311 \
            -f txt

      - name: Dependency vulnerability release gate (Issue #19 — fails on unwaived/expired vulns)
        run: |
          python scripts/check_dependency_vulns.py --report-path pip-audit-report.json

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14

  # ── Job 4: Docker Build Verification ─────────────────────────────────────
  docker-build:
    name: Verify Docker Container Build
    needs: [test, postgres-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: askforwrite/company-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy & Production Verification (main branch only — Issue #17) ──
  deploy-production:
    name: Production Deployment & Commit Verification
    needs: [test, postgres-verification, docker-build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://os.askforwrite.com
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Production Deploy Hook (if configured; else Render GitHub auto-deploy)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set; relying on Render GitHub auto-deploy and enforcing strict live commit_sha_full match."
          fi

      - name: Strict Production Commit SHA & Database Health Verification (Issue #17)
        run: |
          echo "Verifying live deployment on https://os.askforwrite.com matches target commit ${GITHUB_SHA}..."
          ATTEMPTS=0
          MAX_ATTEMPTS=36
          VERIFIED=0
          LAST_STATUS="000"
          LAST_SHA="unknown"
          LAST_DB="unknown"
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            LAST_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" https://os.askforwrite.com/health || true)
            if [ "$LAST_STATUS" = "200" ]; then
              PARSED=$(python3 - <<'PY'
import json
try:
    d = json.load(open('/tmp/health.json'))
    print(d.get('status',''), d.get('database',''), d.get('commit_sha_full',''))
except Exception:
    print('parse_error', 'unknown', 'unknown')
PY
)
              HEALTH_STATE=$(echo "$PARSED" | awk '{print $1}')
              LAST_DB=$(echo "$PARSED" | awk '{print $2}')
              LAST_SHA=$(echo "$PARSED" | awk '{print $3}')
              echo "Attempt $((ATTEMPTS+1))/$MAX_ATTEMPTS: HTTP 200 status=$HEALTH_STATE database=$LAST_DB commit_sha_full=$LAST_SHA"
              if [ "$HEALTH_STATE" = "healthy" ] && [ "$LAST_DB" = "connected" ] && [ "$LAST_SHA" = "${GITHUB_SHA}" ]; then
                VERIFIED=1
                break
              fi
            else
              echo "Attempt $((ATTEMPTS+1))/$MAX_ATTEMPTS: HTTP $LAST_STATUS waiting for rollout..."
            fi
            sleep 10
            ATTEMPTS=$((ATTEMPTS+1))
          done

          if [ $VERIFIED -ne 1 ]; then
            echo "::error::Production verification FAILED. Expected commit=${GITHUB_SHA} + status=healthy + database=connected, observed HTTP=${LAST_STATUS} database=${LAST_DB} commit=${LAST_SHA}"
            exit 1
          fi
          echo "✅ Verified live production running exact commit ${GITHUB_SHA} with database=connected."

      - name: Post deploy summary
        run: |
          echo "## 🚀 Production Deployment & Strict Commit Verification" >> $GITHUB_STEP_SUMMARY
          echo "- **Verified Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** connected" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Live & Commit-Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://os.askforwrite.com" >> $GITHUB_STEP_SUMMARY
