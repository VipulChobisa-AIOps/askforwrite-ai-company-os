name: AskforWrite Company OS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # needed for coverage comment on PRs

jobs:
  # ── Job 1: Lint & Syntax Check ────────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check app tests --select=E,F,W --ignore=E501,E402,E741,W291,W293,W292,F841

      - name: Compile-check all Python files
        run: python -m compileall app tests scripts -q

  # ── Job 2: Unit & Integration Tests with Coverage ─────────────────────────
  test:
    name: Run Tests + Coverage Report
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      APP_ENV: development
      MANAGER_API_KEY: test-manager-api-key-32-chars-long-xxx
      OWNER_API_KEY: test-owner-api-key-32-chars-long-xxx
      DATABASE_URL: sqlite:///./test_ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx anyio sentry-sdk[fastapi] pytest-cov

      - name: Run pytest with coverage
        run: |
          python -m pytest -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage to GitHub Actions summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python -m pytest --co -q 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── Job 3: Security Scan ──────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit + Safety)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit SAST scan (high + medium severity)
        run: |
          bandit -r app/ -ll -ii --exclude app/dashboard \
            --skip B101,B311 \
            -f txt || echo "::warning::Bandit found issues — review before production deploy"

      - name: Safety dependency vulnerability scan
        run: |
          safety check --short-report || echo "::warning::Safety found vulnerable dependencies — update before production"

  # ── Job 4: Docker Build Verification ─────────────────────────────────────
  docker-build:
    name: Verify Docker Container Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: askforwrite/company-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy to Railway (main branch only) ───────────────────────────
  deploy-railway:
    name: Deploy to Railway (Production)
    needs: [test, docker-build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://os.askforwrite.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service os_gateway --detach

      - name: Smoke test after deploy
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Wait for deployment to stabilize
          sleep 30
          # Health check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://os.askforwrite.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Post-deploy health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ Production health check passed (HTTP $STATUS)"

      - name: Post deploy summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://os.askforwrite.com" >> $GITHUB_STEP_SUMMARY
