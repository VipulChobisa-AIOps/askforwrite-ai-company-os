        value: "info@askforwrite.in"
      - key: SMTP_PASSWORD
        sync: false
      - key: OUTREACH_FROM_EMAIL
        value: "info@askforwrite.in"
      # Hostinger WordPress Integration Keys (Set in Render Dashboard if syncing posts)
