# ═══════════════════════════════════════════════════════════════════════════════
# AskforWrite AI Company OS — Render 1-Click Cloud Blueprint
# Repository: VipulChobisa-AIOps/askforwrite-ai-company-os
# Production Custom Domain: os.askforwrite.com
# ═══════════════════════════════════════════════════════════════════════════════

version: "1"

databases:
  - name: askforwrite-db
    databaseName: company_os
    user: afw_admin
    plan: free
    region: singapore
    ipAllowList: [] # Allow internal connections from services in the same region

services:
  - type: web
    name: askforwrite-ai-company-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    domains:
      - os.askforwrite.com
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: askforwrite-db
          property: connectionString
      - key: MANAGER_API_KEY
        generateValue: true
      - key: OWNER_API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://os.askforwrite.com,https://askforwrite.in,https://theaiscene.in,https://careersathi.in,https://edutechguide.in,http://localhost:8000"
      - key: PAYMENT_PROVIDER
        value: sovereign_direct
      # Sovereign Pay Direct 0%-Fee Coordinates (Vipul ICICI & Self-Custody Wallets)
      - key: AFW_MERCHANT_UPI_VPA
        value: "ask4write@icici"
      - key: AFW_MERCHANT_NAME
        value: "AskforWrite AI Solutions"
      - key: AFW_MERCHANT_EVM_WALLET
        value: "0x811db32e3802eD9a75F7bbd24f6C3C03216346a2"
      - key: AFW_MERCHANT_SOL_WALLET
        value: "CNCZWYQL8AC8vDuN6mn4Qfnj2pKghMDuNRzEyepWtXfR"
      - key: AFW_BANK_BENEFICIARY
        value: "Vipul_Kumar_Chobisa"
      - key: AFW_BANK_NAME
        value: "ICICI Bank Ltd"
      - key: AFW_BANK_ACCOUNT_NUMBER
        value: "694001501126"
      - key: AFW_BANK_ACCOUNT_TYPE
        value: "Saving Account"
      - key: AFW_BANK_IFSC
        value: "ICIC0006940"
      - key: AFW_BANK_SWIFT
        value: "ICICINBBXXX"
      - key: AFW_BANK_BRANCH
        value: "Udaipur Bus Stand, Udaipur, Rajasthan, India - 313001"
      - key: WEB3_RPC_URL
        value: "https://polygon-rpc.com"
      - key: UVICORN_WORKERS
        value: "2"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      # AI & Live Search Brain
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      # Outbound Email (Hostinger SMTP)
      - key: SMTP_HOST
        value: "smtp.hostinger.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: "info@askforwrite.in"
